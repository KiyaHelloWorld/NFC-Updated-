<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexTap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF9;--surface:#fff;--ink:#1C1917;--mute:#6B645E;--line:#E7E3DE;--accent:#D9480F;--on-accent:#fff;--ok:#2F7D4F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141211;--surface:#1D1A18;--ink:#F5F2EE;--mute:#A39B93;--line:#332E2A;--accent:#FF8A3D;--on-accent:#1C1917;--ok:#6FCF97}}
:root[data-theme="dark"]{--bg:#141211;--surface:#1D1A18;--ink:#F5F2EE;--mute:#A39B93;--line:#332E2A;--accent:#FF8A3D;--on-accent:#1C1917;--ok:#6FCF97}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
header{max-width:960px;margin:0 auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink);background:none;border:0;cursor:pointer;font-family:inherit;padding:0}
.logo b{color:var(--accent)}
.navlink{background:none;border:0;color:var(--mute);font:600 15px Inter,system-ui,sans-serif;cursor:pointer;padding:8px 0}
.navlink:hover{color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:0 24px 64px}
.screen{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
button{font-family:inherit}
.btn{border:0;border-radius:12px;padding:16px 24px;background:var(--accent);color:var(--on-accent);font:700 17px Inter,system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}

/* landing */
.hero{padding:12vh 0 8vh;max-width:640px}
.hero h1{font-size:clamp(44px,9vw,84px);line-height:1;margin:0 0 20px;font-weight:800;letter-spacing:-.04em}
.hero h1 span{color:var(--accent)}
.hero p{font-size:clamp(18px,3vw,24px);color:var(--mute);margin:0 0 36px}
.flow{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--mute);font-size:15px;margin-top:40px}
.flow i{font-style:normal;color:var(--accent)}

/* profile */
.profile{display:grid;gap:36px;padding-top:24px}
.photo{width:120px;height:120px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:38px}
.profile h2{font-size:clamp(30px,5vw,42px);line-height:1.1;margin:22px 0 12px;letter-spacing:-.02em}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:700;font-size:16px}
.uni{margin:10px 0 0;color:var(--mute)}
.bio{margin:18px 0 0;font-size:18px;max-width:46ch}
.links{list-style:none;margin:0 0 20px;padding:0;border-top:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;padding:18px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:17px}
.links a span{color:var(--mute);font-weight:400;font-size:15px}
.links a:hover{color:var(--accent)}
.connect{width:100%;padding:18px;font-size:18px;letter-spacing:.02em}
.success{display:none;margin-top:24px;max-width:440px;padding:20px;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;background:var(--surface)}
.success h3{margin:0 0 4px;font-size:22px;color:var(--ok)}
.success p{margin:0 0 16px;color:var(--mute)}
.connected .success{display:block;animation:in .3s ease-out}
.connected .connect{display:none}
@media(min-width:760px){.profile{grid-template-columns:1.1fr 1fr;gap:72px;padding-top:56px;align-items:start}.photo{width:148px;height:148px;font-size:46px}}

/* connections */
.conn h2{font-size:clamp(30px,5vw,42px);margin:24px 0 24px;letter-spacing:-.02em}
.list{list-style:none;margin:0;padding:0;max-width:640px;border-top:1px solid var(--line)}
.list li{display:flex;gap:16px;align-items:center;padding:18px 2px;border-bottom:1px solid var(--line)}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;font-weight:800}
.list b{display:block;font-size:18px}
.list small{display:block;color:var(--mute);font-size:15px}
.when{margin-left:auto;color:var(--ok);font-weight:600;font-size:14px;text-align:right}
.new{animation:in .4s ease-out;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.empty{color:var(--mute);padding:20px 0}
.foot{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
.notesum{margin:20px 0 0;padding:18px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface)}
.notesum h3{margin:0 0 10px;font-size:15px;color:var(--mute);font-weight:600}
.notesum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.notesum dt{color:var(--mute);font-size:14px}
.notesum dd{margin:0;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.notesum label{display:block;margin-top:14px;font-size:14px;font-weight:600}
.notesum input,.notesum textarea{display:block;width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 16px Inter,system-ui,sans-serif}
.notesum textarea{min-height:90px;resize:vertical}
.notesum input:focus-visible,.notesum textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.noterow{display:flex;gap:10px;margin-top:18px}
.btn.small{padding:10px 18px;font-size:15px;margin-top:14px}
.noterow .btn.small{margin-top:0}
.nonote{margin:0;color:var(--mute);font-size:15px}
.list li{cursor:pointer}
.list li:hover b{color:var(--accent)}
.list .nt{margin-top:6px;padding-left:10px;border-left:2px solid var(--accent);color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.list .grow{min-width:0;flex:1}
.count{display:inline-block;min-width:22px;padding:1px 8px;margin-left:6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 13px Inter,system-ui,sans-serif;text-align:center;vertical-align:middle;line-height:1.5}
.conn h2 .count{font-size:18px;min-width:30px;padding:2px 11px;margin-left:10px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.screen,.new,.connected .success{animation:none}}
</style>
</head>
<body>
<header>
  <button class="logo" id="home">Nex<b>Tap</b></button>
  <button class="navlink" id="nav-conn">My Connections <span class="count" id="nav-count">0</span></button>
</header>

<main>
  <!-- 1. Landing -->
  <section class="screen" id="s-landing">
    <div class="hero">
      <h1>Nex<span>Tap</span></h1>
      <p>One tap away from a new connection.</p>
      <button class="btn" id="view">NexTap Demo</button>
      <div class="flow"><span>Tap</span><i>→</i><span>Profile</span><i>→</i><span>Connect</span><i>→</i><span>Connection saved</span><i>→</i><span>Build your network</span></div>
    </div>
  </section>

  <!-- 2 + 3. Profile, connected, notes -->
  <section class="screen" id="s-profile" hidden>
    <div class="profile" id="profile">
      <div>
        <div class="photo" id="p-photo" aria-hidden="true"></div>
        <h2 id="p-name"></h2>
        <span class="pill" id="p-role"></span>
        <p class="uni" id="p-uni"></p>
        <p class="bio" id="p-bio"></p>
        <div class="success" role="status">
          <h3>✅ Connected!</h3>
          <p id="p-succ"></p>
          <button class="btn ghost" id="go-conn">View My Connections</button>
        </div>
      </div>
      <div>
        <ul class="links">
          <li><a href="#">LinkedIn <span id="p-li"></span></a></li>
          <li><a href="#">Instagram <span id="p-ig"></span></a></li>
          <li><a href="#">Facebook <span id="p-fb"></span></a></li>
          <li><a href="#">View CV <span>PDF</span></a></li>
          <li><a href="#" id="p-call">Call <span id="p-tel"></span></a></li>
        </ul>
        <button class="btn connect" id="connect">CONNECT</button>
        <div class="notesum" id="notesum" hidden>
          <h3 id="ns-title">Your notes</h3>
          <div id="ns-view">
            <dl id="ns-dl">
              <dt>Met at</dt><dd id="ns-where"></dd>
              <dt>Connected</dt><dd id="ns-when"></dd>
              <dt>Notes</dt><dd id="ns-extra"></dd>
            </dl>
            <p class="nonote" id="ns-empty" hidden>No notes yet.</p>
            <button class="btn ghost small" id="edit-note">Edit</button>
          </div>
          <div id="ns-form" hidden>
            <label for="nw">Where did you meet?</label>
            <input id="nw" type="text" placeholder="e.g. Career fair, DLSU">
            <label for="nd">Date you started to connect</label>
            <input id="nd" type="date">
            <label for="nn">Additional notes</label>
            <textarea id="nn" placeholder="e.g. Interested in startups; follow up next week"></textarea>
            <div class="noterow"><button class="btn small" id="save-note">Save</button><button class="btn ghost small" id="cancel-note">Cancel</button></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. Connections -->
  <section class="screen conn" id="s-conn" hidden>
    <h2>My Connections <span class="count" id="h-count">0</span></h2>
    <ul class="list" id="list"></ul>
    <div class="foot">
      <button class="btn ghost" id="back-profile">Back to profile</button>
      <button class="btn ghost" id="reset">Reset demo</button>
    </div>
  </section>
</main>

<script>
var $=function(id){return document.getElementById(id)};
var screens=['landing','profile','conn'];
function today(){return new Date().toISOString().slice(0,10)}
var SCHOOLS={
  DLSU:{short:'DLSU',emoji:'🏹',full:'De La Salle University, Manila'},
  UST:{short:'UST',emoji:'🐯',full:'University of Santo Tomas'},
  ATENEO:{short:'Ateneo',emoji:'🦅',full:'Ateneo de Manila University'},
  UP:{short:'UP',emoji:'🌻',full:'University of the Philippines Diliman'}
};
var seed=function(){return {
  Bob:{name:'Bob Del Rosario',init:'BD',role:'BS Entrepreneurship',sc:'DLSU',bio:'\u201cInterested in Business, Tech and Food yupieee!\u201d',li:'linkedin.com/in/bobdelrosario',ig:'@SpongeBOB',fb:'facebook.com/BobPogi',tel:'+63 900 000 0000',connected:false,at:0,note:{where:'',when:'',extra:''}},
  Andi:{name:'Andi Lim',init:'AL',role:'Business Management',sc:'DLSU',bio:'\u201cLooking for people who like building businesses from scratch.\u201d',li:'linkedin.com/in/andilim',ig:'@GabiNgLagim',fb:'facebook.com/andilim',tel:'+63 900 000 0001',connected:true,at:1,note:{where:'NexTap pitch day',when:today(),extra:'Interested in marketing and branding.'}},
  Analin:{name:'Analin Panlipunan',init:'AP',role:'Architecture',sc:'UST',bio:'\u201cDesigning spaces that bring people together.\u201d',li:'linkedin.com/in/analin-panlipunan',ig:'@AralNaYa',fb:'facebook.com/analin.panlipunan',tel:'+63 900 000 0005',connected:true,at:5,note:{where:'Design expo',when:today(),extra:'Wants to collaborate on a pop-up booth.'}},
  Sir:{name:'Sir Aulo',init:'SA',role:'Communication',sc:'ATENEO',bio:'\u201cStoryteller who loves branding and social media.\u201d',li:'linkedin.com/in/siraulo',ig:'@SirAulo',fb:'facebook.com/SirAulo',tel:'+63 900 000 0007',connected:true,at:7,note:{where:'Inter-school summit',when:today(),extra:'Offered to review our pitch deck.'}},
  Bogart:{name:'Bogart Smith',init:'BS',role:'Computer Science',sc:'UP',bio:'\u201cInto software, open source, and hackathons.\u201d',li:'linkedin.com/in/bogartsmith',ig:'@AnongBSToh',fb:'facebook.com/bogartsmith',tel:'+63 900 000 0009',connected:true,at:9,note:{where:'Hackathon',when:today(),extra:'Could help with the web app.'}}
}};
var people=seed(),current='Bob',viewed=false;

function updateCount(){
  var c=Object.keys(people).filter(function(k){return people[k].connected}).length;
  $('nav-count').textContent=c;$('h-count').textContent=c;
}
function show(n){
  updateCount();
  screens.forEach(function(x){$('s-'+x).hidden=(x!==n)});
  if(n==='conn')renderList();
  window.scrollTo(0,0);
}
function fmtDate(v){if(!v)return '';var d=new Date(v+'T00:00:00');return isNaN(d)?v:d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}
function setMode(edit){$('ns-view').hidden=edit;$('ns-form').hidden=!edit}
function renderSummary(){
  var p=people[current],n=p.note;
  $('notesum').hidden=!p.connected;
  if(!p.connected)return;
  var has=!!(n.where||n.when||n.extra);
  $('ns-title').textContent='Your notes on '+p.name.split(' ')[0];
  $('ns-dl').hidden=!has;$('ns-empty').hidden=has;
  $('ns-where').textContent=n.where||'-';
  $('ns-when').textContent=fmtDate(n.when)||'-';
  $('ns-extra').textContent=n.extra||'-';
  $('edit-note').textContent=has?'Edit':'Add notes';
}
function openProfile(id){
  current=id;viewed=true;var p=people[id];
  $('p-photo').textContent=p.init;
  $('p-name').textContent=p.name;
  $('p-role').textContent=p.role;
  var sc=SCHOOLS[p.sc];$('p-uni').textContent=sc.emoji+' '+sc.full;
  $('p-bio').textContent=p.bio;
  $('p-li').textContent=p.li;$('p-ig').textContent=p.ig;$('p-fb').textContent=p.fb;
  $('p-tel').textContent=p.tel;
  $('p-call').setAttribute('href','tel:'+p.tel.replace(/\s/g,''));
  $('p-succ').textContent='You can now find '+p.name.split(' ')[0]+' in your connections.';
  $('profile').classList.toggle('connected',p.connected);
  setMode(false);
  renderSummary();
  show('profile');
}
function renderList(){
  var bp=$('back-profile');bp.hidden=!viewed;
  bp.textContent='Back to '+people[current].name.split(' ')[0]+"'s profile";
  var ul=$('list');ul.innerHTML='';
  var items=Object.keys(people).map(function(k){return {id:k,p:people[k]}}).filter(function(x){return x.p.connected}).sort(function(a,b){return b.p.at-a.p.at});
  if(!items.length){ul.innerHTML='<li class="empty">No connections yet.</li>';return}
  items.forEach(function(x){
    var p=x.p,li=document.createElement('li');
    li.tabIndex=0;li.setAttribute('role','link');
    li.innerHTML='<div class="av"></div><div class="grow"><b></b><small></small><div class="nt" hidden></div></div><div class="when">Connected: Today</div>';
    li.querySelector('.av').textContent=p.init;
    li.querySelector('b').textContent=p.name;
    li.querySelector('small').textContent=p.role+' \u2022 '+SCHOOLS[p.sc].short+' '+SCHOOLS[p.sc].emoji;
    var parts=[];if(p.note.where)parts.push('Met at '+p.note.where);if(p.note.extra)parts.push(p.note.extra);
    if(parts.length){var nt=li.querySelector('.nt');nt.textContent=parts.join(' \u2013 ');nt.hidden=false}
    var go=function(){openProfile(x.id)};
    li.onclick=go;li.onkeydown=function(e){if(e.key==='Enter')go()};
    ul.appendChild(li);
  });
}
updateCount();
$('view').onclick=function(){openProfile('Bob')};
$('home').onclick=function(){show('landing')};
$('nav-conn').onclick=function(){show('conn')};
$('connect').onclick=function(){
  var p=people[current];p.connected=true;p.at=Date.now();
  if(!p.note.when)p.note.when=today();
  openProfile(current);
};
$('go-conn').onclick=function(){show('conn')};
$('back-profile').onclick=function(){openProfile(current)};
$('edit-note').onclick=function(){
  var n=people[current].note;
  $('nw').value=n.where;$('nd').value=n.when||today();$('nn').value=n.extra;
  setMode(true);$('nw').focus();
};
$('save-note').onclick=function(){
  people[current].note={where:$('nw').value.trim(),when:$('nd').value,extra:$('nn').value.trim()};
  renderSummary();setMode(false);
};
$('cancel-note').onclick=function(){setMode(false)};
$('reset').onclick=function(){people=seed();current='Bob';viewed=false;show('landing')};
</script>
</body>
</html>
